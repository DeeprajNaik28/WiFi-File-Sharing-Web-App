<!DOCTYPE html>
<html>

<head>

<title>WiFi Share</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#4facfe,#00f2fe);
display:flex;
justify-content:center;
align-items:flex-start;
min-height:100vh;
padding-top:40px;
margin:0;
}

.container{
background:white;
padding:25px;
border-radius:12px;
width:90%;
max-width:420px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
margin-bottom:40px;
}

h1{
margin-bottom:10px;
}

button{
background:#4facfe;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
margin-top:8px;
font-size:15px;
}

button:hover{
background:#2c8cff;
}

input{
margin-top:10px;
}

progress{
width:100%;
height:15px;
margin-top:10px;
}

.dropzone{
border:2px dashed #4facfe;
padding:20px;
margin-top:15px;
border-radius:10px;
color:#555;
}

.device{
background:#f5f5f5;
padding:12px;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.download-link{
display:block;
margin-top:15px;
font-weight:bold;
color:#2c8cff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>📡 WiFi Share</h1>

<h3>Connect Devices</h3>

<img id="qr" width="150">

<p id="url"></p>

<h3>Available Devices</h3>

<div id="devices"></div>

<h3>Send File</h3>

<input type="file" id="file">

<br>

<button onclick="sendSelectedFile()">
Send File
</button>

<div class="dropzone" id="dropzone">
Drag & Drop file here
</div>

<progress id="progress" value="0" max="100"></progress>

<p id="speed">Speed: 0 MB/s</p>

<div id="downloads"></div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let deviceName = prompt("Enter device name")

if(!deviceName){
deviceName = "Unknown Device"
}

socket.emit("set-name", deviceName)

/* ---------- QR ---------- */

fetch("/qr")
.then(res=>res.json())
.then(data=>{

document.getElementById("qr").src = data.qr
document.getElementById("url").innerText = data.url

})

/* ---------- WEBRTC ---------- */

let peerConnection
let dataChannel

const configuration = {
iceServers:[
{
urls:"stun:stun.l.google.com:19302"
}
]
}

/* ---------- DEVICE LIST ---------- */

socket.on("users",(users)=>{

let devices = document.getElementById("devices")

devices.innerHTML = ""

users.forEach(user=>{

if(user.id === socket.id) return

let div = document.createElement("div")

div.className = "device"

div.innerHTML = `
📱 ${user.name}
<br>
<button onclick="connectDevice('${user.id}')">
Connect
</button>
`

devices.appendChild(div)

})

})

/* ---------- CONNECT ---------- */

function connectDevice(id){

createPeer(id)

alert("Connection request sent!")

}

/* ---------- FILE RECEIVE ---------- */

let receivedBuffers = []

let receivedFileInfo = null

function setupDataChannel(channel){

dataChannel = channel

dataChannel.onopen = ()=>{

alert("✅ Devices connected directly!")

}

dataChannel.onmessage = (event)=>{

if(typeof event.data === "string"){

const msg = JSON.parse(event.data)

if(msg.type === "file-info"){

receivedFileInfo = msg

receivedBuffers = []

}

}else{

receivedBuffers.push(event.data)

const receivedBlob = new Blob(
receivedBuffers,
{
type: receivedFileInfo.mime
}
)

if(receivedBlob.size >= receivedFileInfo.size){

const url = URL.createObjectURL(receivedBlob)

const link = document.createElement("a")

link.href = url

link.download = receivedFileInfo.name

link.className = "download-link"

link.innerText =
"⬇ Download " + receivedFileInfo.name

document
.getElementById("downloads")
.appendChild(link)

}

}

}

}

/* ---------- CREATE PEER ---------- */

async function createPeer(targetId){

peerConnection =
new RTCPeerConnection(configuration)

const channel =
peerConnection.createDataChannel("fileTransfer")

setupDataChannel(channel)

peerConnection.onicecandidate = (event)=>{

if(event.candidate){

socket.emit("ice-candidate",{
target: targetId,
candidate: event.candidate
})

}

}

const offer =
await peerConnection.createOffer()

await peerConnection
.setLocalDescription(offer)

socket.emit("offer",{
target: targetId,
offer
})

}

/* ---------- RECEIVE OFFER ---------- */

socket.on("offer", async (data)=>{

peerConnection =
new RTCPeerConnection(configuration)

peerConnection.ondatachannel = (event)=>{

setupDataChannel(event.channel)

}

peerConnection.onicecandidate = (event)=>{

if(event.candidate){

socket.emit("ice-candidate",{
target:data.from,
candidate:event.candidate
})

}

}

await peerConnection.setRemoteDescription(
new RTCSessionDescription(data.offer)
)

const answer =
await peerConnection.createAnswer()

await peerConnection
.setLocalDescription(answer)

socket.emit("answer",{
target:data.from,
answer
})

})

/* ---------- RECEIVE ANSWER ---------- */

socket.on("answer", async (data)=>{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(data.answer)
)

})

/* ---------- ICE ---------- */

socket.on("ice-candidate", async (data)=>{

try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(data.candidate)
)

}catch(err){

console.log(err)

}

})

/* ---------- SEND FILE ---------- */

function sendSelectedFile(){

const file =
document.getElementById("file").files[0]

sendFile(file)

}

function sendFile(file){

if(!dataChannel ||
dataChannel.readyState !== "open"){

alert("Connect device first!")

return

}

const chunkSize = 16 * 1024

let offset = 0

const reader = new FileReader()

const startTime = new Date().getTime()

dataChannel.send(JSON.stringify({
type:"file-info",
name:file.name,
size:file.size,
mime:file.type
}))

reader.onload = (event)=>{

dataChannel.send(event.target.result)

offset += event.target.result.byteLength

let percent = (offset/file.size)*100

document.getElementById("progress").value =
percent

let currentTime = new Date().getTime()

let elapsed = (currentTime-startTime)/1000

let speed =
(offset/elapsed)/1024/1024

document.getElementById("speed").innerText =
"Speed: " + speed.toFixed(2) + " MB/s"

if(offset < file.size){

readSlice(offset)

}else{

alert("✅ File sent!")

}

}

function readSlice(o){

const slice =
file.slice(offset, o + chunkSize)

reader.readAsArrayBuffer(slice)

}

readSlice(0)

}

/* ---------- DRAG DROP ---------- */

const dropzone =
document.getElementById("dropzone")

dropzone.addEventListener("dragover",e=>{
e.preventDefault()
})

dropzone.addEventListener("drop",e=>{

e.preventDefault()

const file = e.dataTransfer.files[0]

sendFile(file)

})

</script>

</body>

</html>
